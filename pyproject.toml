[project]
name = "arbiter-supply-chain"
version = "0.1.0"
description = "Governed conversational analytics for supply chain"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-dotenv>=1.0,<2",
  "snowflake-connector-python>=3.12,<4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
